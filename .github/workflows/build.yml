name: Build Desktop Apps (macOS & Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --omit=optional

      - name: Build macOS (dmg + zip, Intel & Apple Silicon)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Build Windows (NSIS installer, auto-retry)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --win --publish never || {
            echo "::warning::electron-builder failed once — retrying"
            sleep 15
            npx electron-builder --win --publish never
          }

      - name: Diagnostics (only on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== versions ==="
          node -v
          npx electron-builder --version || true
          echo "=== release dir ==="
          ls -la release 2>/dev/null || echo "(release dir not created — see failed step above)"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-distributables
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-distributables/*
            artifacts/windows-installer/*
